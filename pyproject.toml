[project]
name = "doppler-geolocator"
version = "1.2.0"
description = "Geolocate audio recordings by matching acoustic Doppler ridges of passing aircraft against ADS-B trajectories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["docs", "var", "node_modules"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import sorting, bugbear and a few modernisations.
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = [
    "E702",   # one-line `a = ...; b = ...` groups are used deliberately for the normal equations
    "B008",   # FastAPI's File()/Form() defaults are the documented idiom
    "B905",   # zip(strict=...) adds noise on arrays already checked for equal length
    "UP006", "UP007", "UP035", "UP045",  # keep typing.List/Optional spelling consistent across modules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
